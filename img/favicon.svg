<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crescent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD6BA" />
      <stop offset="70%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#BD5738" />
    </linearGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8D6" stop-opacity="1" />
      <stop offset="40%" stop-color="#E48B6C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97757" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Squircle backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#141312" stroke="#262322" stroke-width="1" />
  <!-- Planet base (night side) -->
  <circle cx="32" cy="32" r="15" fill="#262322" />
  <!-- Crescent mask / path -->
  <!-- A circle with an intersecting bite creating the sunlit coral crescent -->
  <path d="M 32 17 A 15 15 0 0 0 18.5 38.5 A 14 14 0 0 1 32 17 Z" fill="url(#crescent-grad)" />
  <path d="M 18.5 38.5 A 15 15 0 0 0 43 41 A 13.5 13.5 0 0 1 18.5 38.5 Z" fill="url(#crescent-grad)" />
  <!-- Smoothed full crescent -->
  <path d="M 21.5 21.5 C 15 28 15 36 21 42 C 27 48 35 48 41 42 C 34 46 25 43 22 36 C 19 29 23 23 27 20 C 24.5 20 22.8 20.6 21.5 21.5 Z" fill="url(#crescent-grad)" />
  <!-- Orbit line -->
  <path d="M 14 47 C 20 45 32 38 43 27 C 47 23 50 19 51 17" fill="none" stroke="#D97757" stroke-width="2.5" stroke-linecap="round" />
  <!-- Moon glow & body -->
  <circle cx="51" cy="17" r="6" fill="url(#moon-glow)" />
  <circle cx="51" cy="17" r="2.8" fill="#FFE8D6" filter="url(#glow)" />
</svg>