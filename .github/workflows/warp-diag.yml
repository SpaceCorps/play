name: WARP start crash diagnosis

# Why does the SpaceCorps 2027 Windows client segfault before its first frame on the software renderer
# (Microsoft Basic Render Driver)? Uses only the PUBLIC released 0.5.0 x64 zip (sha-checked), no secret:
# logs and artifacts of this public repository are public, so only error locations, exit codes and
# stack frames are printed. Nothing is released or published by it.

on:
  push:
    branches: [warp-crash-diag]
    paths: [".github/workflows/warp-diag.yml", ".github/warp-diag/**"]
  workflow_dispatch:
    inputs:
      os:
        description: "runner label"
        required: true
        default: windows-latest

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  cdb:
    runs-on: ${{ github.event_name == 'push' && 'windows-latest' || inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The released x64 package
        run: ./.github/warp-diag/fetch-x64.ps1 -Dest "$env:RUNNER_TEMP\pkg"
      - name: "Start it once, plain: exit code and the Application log"
        continue-on-error: true
        run: |
          $exe = "$env:RUNNER_TEMP\pkg\x64\SpaceCorps 2027\spacecorps2027.exe"
          $env:SPACE3D_HEADLESS = '1280x720'
          $since = Get-Date
          Start-Service WerSvc -ErrorAction SilentlyContinue
          foreach ($i in 1..3) { ./.github/warp-diag/run-once.ps1 -Exe $exe -Work "$env:RUNNER_TEMP\w$i" -Label "plain $i" | Select-Object -SkipLast 1 }
          "--- Application log since the first start"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since } -ErrorAction SilentlyContinue |
            ForEach-Object { "[$($_.TimeCreated.ToString('HH:mm:ss'))] $($_.ProviderName) $($_.Id): $(($_.Message -split "`n" | Select-Object -First 14) -join ' | ')" }
      - name: "Start it under cdb: the second-chance exception"
        run: |
          $exe = "$env:RUNNER_TEMP\pkg\x64\SpaceCorps 2027\spacecorps2027.exe"
          $env:SPACE3D_HEADLESS = '1280x720'
          ./.github/warp-diag/cdb-run.ps1 -Exe $exe -Work "$env:RUNNER_TEMP\cdb1"

  variants:
    runs-on: ${{ github.event_name == 'push' && 'windows-latest' || inputs.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: base,       vars: "SPACE3D_HEADLESS=1280x720" }
          - { name: small,      vars: "SPACE3D_HEADLESS=640x360" }
          - { name: windowed,   vars: "" }
          - { name: fxc,        vars: "SPACE3D_HEADLESS=1280x720;WGPU_DX12_COMPILER=fxc" }
          - { name: vulkan,     vars: "SPACE3D_HEADLESS=1280x720;WGPU_BACKEND=vulkan" }
          - { name: gl,         vars: "SPACE3D_HEADLESS=1280x720;WGPU_BACKEND=gl" }
    steps:
      - uses: actions/checkout@v4
      - name: The released x64 package
        run: ./.github/warp-diag/fetch-x64.ps1 -Dest "$env:RUNNER_TEMP\pkg"
      - name: "Start it 8 times: ${{ matrix.name }}"
        run: ./.github/warp-diag/variant.ps1 -Exe "$env:RUNNER_TEMP\pkg\x64\SpaceCorps 2027\spacecorps2027.exe" -Name "${{ matrix.name }}" -Vars "${{ matrix.vars }}"
