name: WARP start crash diagnosis

# Why does the SpaceCorps 2027 Windows client segfault before its first frame on the software renderer
# (Microsoft Basic Render Driver)? Uses only the PUBLIC released 0.5.0 x64 zip (sha-checked), no secret:
# logs and artifacts of this public repository are public, so only error locations, exit codes and
# stack frames are printed. Nothing is released or published by it.

on:
  push:
    branches: [warp-crash-diag]
    paths: [".github/workflows/warp-diag.yml", ".github/warp-diag/**"]
  workflow_dispatch:
    inputs:
      os:
        description: "runner label"
        required: true
        default: windows-latest

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  variants:
    runs-on: ${{ github.event_name == 'push' && 'windows-latest' || inputs.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: warp-1.0.13,   vars: "SPACE3D_HEADLESS=1280x720;WARPDIAG_SHOWWARP=1", count: 12, warp: "1.0.13" }
          - { name: warp-1.0.14,   vars: "SPACE3D_HEADLESS=1280x720;WARPDIAG_SHOWWARP=1", count: 12, warp: "1.0.14" }
          - { name: warp-1.0.14.2, vars: "SPACE3D_HEADLESS=1280x720;WARPDIAG_SHOWWARP=1", count: 12, warp: "1.0.14.2" }
          - { name: warp-1.0.15,   vars: "SPACE3D_HEADLESS=1280x720;WARPDIAG_SHOWWARP=1", count: 12, warp: "1.0.15" }
    steps:
      - uses: actions/checkout@v4
      - name: The released x64 package
        run: ./.github/warp-diag/fetch-x64.ps1 -Dest "$env:RUNNER_TEMP\pkg"
      - name: "WARP from NuGet, app-local: ${{ matrix.warp }}"
        if: matrix.warp
        run: ./.github/warp-diag/newwarp.ps1 -ExeDir "$env:RUNNER_TEMP\pkg\x64\SpaceCorps 2027" -Version "${{ matrix.warp }}"
      - name: "Start it ${{ matrix.count }} times: ${{ matrix.name }}"
        run: ./.github/warp-diag/variant.ps1 -Exe "$env:RUNNER_TEMP\pkg\x64\SpaceCorps 2027\spacecorps2027.exe" -Name "${{ matrix.name }}" -Vars "${{ matrix.vars }}" -Count ${{ matrix.count }}

