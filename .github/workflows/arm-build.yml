# Published as .github/workflows/arm-build.yml of the PUBLIC repository SpaceCorps/play (the one whose
# runners are free, like mac-build.yml); this copy is where it is reviewed with the rest of the ARM work
# (docs/design/arm-builds.md).
name: ARM64 build check

# Builds the SpaceCorps 2027 client NATIVELY on GitHub's free Arm runners and starts it headless: the
# proof the release PC cannot give (it is an x86_64 machine: Linux ARM64 runs only under QEMU there and a
# Windows on Arm exe cannot run at all). Nothing is released or published by it, and no binary is uploaded
# (artifacts of a public repository are public): only the screenshots the headless game writes.
#
# The game's source is private: it is cloned here with the read-only token SOURCE_TOKEN (Contents read on
# SpaceCorps/SpaceCorps2027 and SpaceCorps/Space3d), as mac-build.yml does, and the build log stays on the
# runner: only the error lines (message and file:line, not the source) and the game's own start-up lines are
# printed.
#
#   gh workflow run arm-build.yml -R SpaceCorps/play -f ref=<branch, commit or tag of SpaceCorps2027> -f jobs=probe|linux|windows|x64|crash|all
#
# A pull request that changes this file only runs the probe (no secret).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, commit or tag of SpaceCorps/SpaceCorps2027 to build
        required: true
        default: main
      jobs:
        description: "What to run: probe (a minute: what the runners have), linux, windows, x64 (the released x86_64 build under Windows' emulation), crash (why a start on the software renderer segfaults), or all"
        required: true
        default: probe
  pull_request:
    paths: [".github/workflows/arm-build.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  probe:
    if: github.event_name == 'pull_request' || inputs.jobs == 'probe' || inputs.jobs == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: The machine
        run: |
          uname -a
          echo "PROCESSOR_ARCHITECTURE=${PROCESSOR_ARCHITECTURE:-} PROCESSOR_ARCHITEW6432=${PROCESSOR_ARCHITEW6432:-}"
          echo "cpus: $(nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")"
          df -h . 2>/dev/null | tail -2 || true
      - name: The tools
        run: |
          for t in git bash curl unzip zip tar python3 python jq cmake perl gcc clang cc make rustup rustc cargo file pkg-config vulkaninfo cl link; do
            printf '%-12s %s\n' "$t" "$(command -v "$t" || echo -)"
          done
          rustc --version || true
          cargo --version || true
          rustup show 2>&1 | head -12 || true
          python3 --version 2>&1 || true
      - name: Windows only - Visual Studio and the SDK
        if: runner.os == 'Windows'
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          "$vswhere" -all -products '*' -format json 2>/dev/null | grep -E '"(displayName|installationVersion|installationPath)"' || true
          ls "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC" 2>/dev/null || true
          ls /c/Program\ Files\ \(x86\)/Windows\ Kits/10/Lib 2>/dev/null || true
          ls /c/Program\ Files\ \(x86\)/Windows\ Kits/10/Lib/*/um 2>/dev/null || true
          ls /c/Program\ Files/Git/bin 2>/dev/null | head -3 || true
          file /c/Program\ Files/Git/bin/bash.exe 2>/dev/null || true
      - name: Linux only - packages
        if: runner.os == 'Linux'
        run: |
          apt-cache policy libasound2-dev libdbus-1-dev mesa-vulkan-drivers libvulkan1 | grep -E '^[a-z]|Candidate' || true
          ls /usr/share/vulkan/icd.d 2>/dev/null || true

  linux:
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'linux' || inputs.jobs == 'all')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Source (private, read-only token)
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          test -n "$SOURCE_TOKEN" || { echo "the secret SOURCE_TOKEN is not set"; exit 1; }
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/SpaceCorps/".insteadOf "https://github.com/SpaceCorps/"
          git clone --quiet https://github.com/SpaceCorps/SpaceCorps2027.git src
          git -C src checkout --quiet "$REF"
          echo "source at $(git -C src rev-parse --short=7 HEAD)"

      - name: System libraries (build, and a software Vulkan to run on)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libasound2-dev libdbus-1-dev pkg-config cmake perl file \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1 >/dev/null
          uname -m

      - name: Build (cargo build --release, natively)
        working-directory: src
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          SPACECORPS_CI_BUILD: "1"
        run: |
          set +e
          date -u +%H:%M:%S
          cargo build --release --locked -p spacecorps2027 -p spacecorps-assetpack > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          date -u +%H:%M:%S
          # The log is private (compiler messages quote the source): only the message and place of each error.
          grep -E '^(error|warning: unused)|^ +--> ' "$RUNNER_TEMP/build.log" | grep -vE '^warning' | cut -c1-200 | head -40
          if [ "$rc" -ne 0 ]; then echo "the build failed (exit $rc)"; exit "$rc"; fi
          ls -l target/release/spacecorps2027 target/release/assetpack
          file target/release/spacecorps2027 | cut -c1-200

      - name: "Pack the assets in a copy and start it headless (8 times: the Windows runs showed a flaky start)"
        working-directory: src
        run: |
          set -e
          work="$RUNNER_TEMP/pack"
          rm -rf "$work"; mkdir -p "$work/assets" "$work/app" "$RUNNER_TEMP/shots" "$RUNNER_TEMP/home"
          cp -R assets/. "$work/assets/"
          scripts/release/prune-assets.sh "$work/assets" >/dev/null
          cp target/release/spacecorps2027 "$work/app/spacecorps2027"
          target/release/assetpack append "$work/app/spacecorps2027" "$work/assets" >/dev/null
          target/release/assetpack verify "$work/app/spacecorps2027" --against "$work/assets" | cut -c1-200
          cd /
          set +e
          ok=0; crashed=0
          for i in 1 2 3 4 5 6 7 8; do
            rm -rf "$RUNNER_TEMP/shots"; mkdir -p "$RUNNER_TEMP/shots"
            start=$(date +%s)
            # (as scripts/release/smoke-test.sh runs the tarball's binary: another folder, a fresh HOME, software Vulkan)
            timeout 900 env -i PATH=/usr/bin:/bin "HOME=$RUNNER_TEMP/home" WGPU_BACKEND=vulkan SPACE3D_HEADLESS=1280x720 SPACE3D_AUDIO=off \
              SPACE3D_EXIT_AFTER_SECS=12 SPACECORPS_SHOT_EVERY=5 SPACECORPS_SCREEN=login "SPACECORPS_SHOTS=$RUNNER_TEMP/shots" \
              "$work/app/spacecorps2027" > "$RUNNER_TEMP/run.log" 2>&1
            rc=$?
            n=$(find "$RUNNER_TEMP/shots" -name 'shot_*.png' | wc -l)
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/run.log" > "$RUNNER_TEMP/run.txt"
            echo "run $i: exit $rc after $(( $(date +%s) - start )) s, $n screenshots, $(grep -ac 'auto-exit' "$RUNNER_TEMP/run.txt") auto-exit"
            if [ "$rc" = 0 ] && [ "$n" -gt 0 ]; then ok=$((ok + 1)); else crashed=$((crashed + 1)); fi
            if [ "$i" = 1 ]; then
              grep -aE 'SpaceCorps 2027 [0-9][^ ]* \(|assets: .*packed in|renderer initialised|audio disabled|auto-exit|panicked|fatal|Segmentation' "$RUNNER_TEMP/run.txt" | cut -c1-260
              grep -aq 'aarch64-unknown-linux-gnu)' "$RUNNER_TEMP/run.txt" || { echo "the version line names another target"; exit 1; }
            fi
            grep -aiE 'panicked|fatal' "$RUNNER_TEMP/run.txt" && exit 1
          done
          echo "TALLY linux aarch64 native: $ok of 8 runs started, ran and wrote screenshots; $crashed did not"
          [ "$ok" -gt 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: arm-linux-screenshots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 3
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'windows' || inputs.jobs == 'all')
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-pc-windows-gnullvm, aarch64-pc-windows-msvc]
    runs-on: windows-11-arm
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Source (private, read-only token)
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          test -n "$SOURCE_TOKEN" || { echo "the secret SOURCE_TOKEN is not set"; exit 1; }
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/SpaceCorps/".insteadOf "https://github.com/SpaceCorps/"
          git clone --quiet https://github.com/SpaceCorps/SpaceCorps2027.git src
          git -C src checkout --quiet "$REF"
          echo "source at $(git -C src rev-parse --short=7 HEAD)"

      - name: Rust (the toolchain rust-toolchain.toml pins, for this target)
        working-directory: src
        run: |
          set -e
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/rustup-init.exe" https://win.rustup.rs/aarch64
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal >/dev/null
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup show active-toolchain || true
          rustup target add "${{ matrix.target }}" 2>&1 | tail -2
          rustc --version --verbose | grep -E '^(rustc|host)'

      - name: llvm-mingw (gnullvm only)
        if: matrix.target == 'aarch64-pc-windows-gnullvm'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-aarch64.zip
          echo "8f24fedd0b75c674c6c83dec2d76a7ac31a690120212843a17e465ef49854f69  llvm-mingw.zip" | sha256sum -c -
          unzip -q llvm-mingw.zip
          rm llvm-mingw.zip
          bin="$(pwd)/llvm-mingw-20261020-ucrt-aarch64/bin"
          "$bin/aarch64-w64-mingw32-clang" --version | head -2
          echo "LLVM_MINGW_BIN=$bin" >> "$GITHUB_ENV"

      - name: "Build and package (gnullvm: scripts/release-local.sh --arm-only, as the release PC runs it)"
        if: matrix.target == 'aarch64-pc-windows-gnullvm'
        working-directory: src
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          PYTHONUTF8: "1"
          SPACECORPS_CI_BUILD: "1"
        run: |
          set +e
          date -u +%H:%M:%S
          scripts/release-local.sh --arm-only --only windows --unsigned --out "$RUNNER_TEMP/out" > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          date -u +%H:%M:%S
          # The log is private (compiler messages quote the source): the script's own summary lines and each error's place.
          grep -aE '^(SpaceCorps 2027 [0-9]|stamped |no local paths|imports: |ok: |.*is not an ARM64|the exe needs|missing )|^error|^ +--> |windows-aarch64\.zip \(' "$RUNNER_TEMP/build.log" | cut -c1-200 | head -60
          if [ "$rc" -ne 0 ]; then echo "the build failed (exit $rc)"; tail -5 "$RUNNER_TEMP/build.log" | grep -avE '^ +[0-9]+ \||^ +\|' | cut -c1-200; exit "$rc"; fi
          ls -l "$RUNNER_TEMP/out"

      - name: "Smoke test (the exe itself, headless: scripts/release/smoke-test.sh --only windows-aarch64)"
        if: matrix.target == 'aarch64-pc-windows-gnullvm'
        working-directory: src
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          PATH="$PATH:$LLVM_MINGW_BIN" scripts/release/smoke-test.sh --out "$RUNNER_TEMP/out" --only windows-aarch64 --secs 12 > "$RUNNER_TEMP/smoke.log" 2>&1
          rc=$?
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/smoke.log" | grep -aE '^(ok|skip|FAIL|==>)|passed' | cut -c1-220
          if [ "$rc" -ne 0 ]; then echo "the smoke test failed (exit $rc)"; sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/smoke.log" | tail -12 | cut -c1-200; fi
          mkdir -p "$RUNNER_TEMP/shots"
          cp "$RUNNER_TEMP"/out/smoke/windows-aarch64/shots/*.png "$RUNNER_TEMP/shots/" 2>/dev/null || true
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/out/smoke/windows-aarch64/log.txt" 2>/dev/null | grep -aE 'renderer initialised|adapter|auto-exit|panicked|fatal|audio' | cut -c1-260 || true
          exit "$rc"

      - name: "Build (msvc: cargo build --release, natively)"
        if: matrix.target == 'aarch64-pc-windows-msvc'
        working-directory: src
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          SPACECORPS_CI_BUILD: "1"
        run: |
          set +e
          date -u +%H:%M:%S
          cargo build --release --locked -p spacecorps2027 --target aarch64-pc-windows-msvc > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          date -u +%H:%M:%S
          grep -aE '^error|^ +--> |LNK[0-9]+|link\.exe|rc\.exe' "$RUNNER_TEMP/build.log" | cut -c1-200 | head -40
          if [ "$rc" -ne 0 ]; then echo "the build failed (exit $rc)"; exit "$rc"; fi
          ls -l target/aarch64-pc-windows-msvc/release/spacecorps2027.exe
          file target/aarch64-pc-windows-msvc/release/spacecorps2027.exe | cut -c1-200

      - name: Start it headless (msvc; its assets are the compile-time fallback, this checkout's)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        working-directory: src
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/shots" "$RUNNER_TEMP/home"
          wh=$(cygpath -m "$RUNNER_TEMP/home")
          exe=target/aarch64-pc-windows-msvc/release/spacecorps2027.exe
          start=$(date +%s)
          timeout 900 env SPACE3D_HEADLESS=1280x720 SPACE3D_AUDIO=off SPACE3D_EXIT_AFTER_SECS=12 SPACECORPS_SHOT_EVERY=5 SPACECORPS_SCREEN=login \
            "SPACECORPS_SHOTS=$(cygpath -m "$RUNNER_TEMP/shots")" "HOME=$wh" "USERPROFILE=$wh" "APPDATA=$wh/AppData/Roaming" "LOCALAPPDATA=$wh/AppData/Local" \
            "$exe" > "$RUNNER_TEMP/run.log" 2>&1
          rc=$?
          echo "exit $rc after $(( $(date +%s) - start )) s"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/run.log" > "$RUNNER_TEMP/run.txt"
          grep -aE 'SpaceCorps 2027 [0-9][^ ]* \(|renderer initialised|adapter|audio|auto-exit|panicked|fatal' "$RUNNER_TEMP/run.txt" | cut -c1-260
          n=$(find "$RUNNER_TEMP/shots" -name 'shot_*.png' | wc -l)
          echo "$n screenshots"
          grep -aiE 'panicked|fatal' "$RUNNER_TEMP/run.txt" && exit 1
          [ "$n" -gt 0 ] || { tail -15 "$RUNNER_TEMP/run.txt" | cut -c1-200; exit 1; }
          grep -aq 'aarch64-pc-windows-msvc)' "$RUNNER_TEMP/run.txt"

      - name: "Repeat: the ARM64 exe started 8 times, headless (the first runs crashed, a later one did not)"
        if: always()
        working-directory: src
        run: |
          set +e
          if [ "${{ matrix.target }}" = aarch64-pc-windows-gnullvm ]; then
            exe="$RUNNER_TEMP/out/smoke/windows-aarch64/SpaceCorps 2027/spacecorps2027.exe"
          else
            exe="$PWD/target/aarch64-pc-windows-msvc/release/spacecorps2027.exe"
          fi
          [ -f "$exe" ] || { echo "no exe at $exe"; exit 0; }
          mkdir -p "$RUNNER_TEMP/home"
          wh=$(cygpath -m "$RUNNER_TEMP/home")
          ok=0; crashed=0
          for i in 1 2 3 4 5 6 7 8; do
            rm -rf "$RUNNER_TEMP/dshots"; mkdir -p "$RUNNER_TEMP/dshots"
            start=$(date +%s)
            timeout 300 env SPACE3D_HEADLESS=1280x720 SPACE3D_AUDIO=off SPACE3D_EXIT_AFTER_SECS=12 SPACECORPS_SHOT_EVERY=5 SPACECORPS_SCREEN=login \
              "SPACECORPS_SHOTS=$(cygpath -m "$RUNNER_TEMP/dshots")" "HOME=$wh" "USERPROFILE=$wh" "APPDATA=$wh/AppData/Roaming" "LOCALAPPDATA=$wh/AppData/Local" \
              "$exe" > "$RUNNER_TEMP/d.log" 2>&1
            rc=$?
            n=$(find "$RUNNER_TEMP/dshots" -name 'shot_*.png' | wc -l)
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/d.log" > "$RUNNER_TEMP/d.txt"
            last=$(grep -aE '^20[0-9-]+T' "$RUNNER_TEMP/d.txt" | tail -1 | cut -c28-130)
            echo "run $i: exit $rc after $(( $(date +%s) - start )) s, $n screenshots, last log line: $last"
            if [ "$rc" = 0 ] && [ "$n" -gt 0 ]; then ok=$((ok + 1)); else crashed=$((crashed + 1)); fi
          done
          echo "TALLY ${{ matrix.target }} native: $ok of 8 runs started, ran and wrote screenshots; $crashed did not"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: arm-windows-${{ matrix.target }}-screenshots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 3
          if-no-files-found: ignore

  windows-x64-emulated:
    # The released x86_64 build on the Arm runner (emulated) and, as the control, on an ordinary x64 runner: the same
    # software renderer (Microsoft Basic Render Driver / WARP), no GPU.
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'x64' || inputs.jobs == 'all')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: The released x86_64 package (public), checked against the release's list
        run: |
          set -e
          cd "$RUNNER_TEMP"
          base=https://github.com/SpaceCorps/play/releases/download/v0.5.0
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          curl -fsSL -o SpaceCorps2027-windows-x86_64.zip "$base/SpaceCorps2027-windows-x86_64.zip"
          grep ' SpaceCorps2027-windows-x86_64.zip$' SHA256SUMS | sha256sum -c -
          unzip -q SpaceCorps2027-windows-x86_64.zip -d x64
          file "x64/SpaceCorps 2027/spacecorps2027.exe" | cut -c1-160

      - name: Start it headless 8 times (x64 code; emulated by Windows on Arm on the Arm runner)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/home"
          wh=$(cygpath -m "$RUNNER_TEMP/home")
          exe="$RUNNER_TEMP/x64/SpaceCorps 2027/spacecorps2027.exe"
          ok=0; crashed=0
          for i in 1 2 3 4 5 6 7 8; do
            rm -rf "$RUNNER_TEMP/shots"; mkdir -p "$RUNNER_TEMP/shots"
            start=$(date +%s)
            timeout 600 env SPACE3D_HEADLESS=1280x720 SPACE3D_AUDIO=off SPACE3D_EXIT_AFTER_SECS=12 SPACECORPS_SHOT_EVERY=5 SPACECORPS_SCREEN=login \
              "SPACECORPS_SHOTS=$(cygpath -m "$RUNNER_TEMP/shots")" "HOME=$wh" "USERPROFILE=$wh" "APPDATA=$wh/AppData/Roaming" "LOCALAPPDATA=$wh/AppData/Local" \
              "$exe" > "$RUNNER_TEMP/run.log" 2>&1
            rc=$?
            n=$(find "$RUNNER_TEMP/shots" -name 'shot_*.png' | wc -l)
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/run.log" > "$RUNNER_TEMP/run.txt"
            last=$(grep -aE '^20[0-9-]+T' "$RUNNER_TEMP/run.txt" | tail -1 | cut -c28-130)
            echo "run $i: exit $rc after $(( $(date +%s) - start )) s, $n screenshots, last log line: $last"
            if [ "$rc" = 0 ] && [ "$n" -gt 0 ]; then ok=$((ok + 1)); else crashed=$((crashed + 1)); fi
          done
          echo "TALLY x64 build on ${{ matrix.os }}: $ok of 8 runs started, ran and wrote screenshots; $crashed did not"
          [ "$ok" -gt 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: arm-windows-x64-${{ matrix.os }}-screenshots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 3
          if-no-files-found: ignore

  windows-crash:
    # Why does a start on the software renderer (Microsoft Basic Render Driver / WARP) segfault before the first frame?
    # The released x86_64 build, started until Windows' error reporting writes a dump; the dump is read on the runner
    # and only the exception code, the faulting module and its offset are printed (docs/design/arm-builds.md, step 1c).
    # Then the same start with a visible window and with other wgpu settings, 8 starts each. Nothing is uploaded.
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'crash' || inputs.jobs == 'all')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: The released x86_64 package (public), checked against the release's list
        run: |
          set -e
          cd "$RUNNER_TEMP"
          base=https://github.com/SpaceCorps/play/releases/download/v0.5.0
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          curl -fsSL -o SpaceCorps2027-windows-x86_64.zip "$base/SpaceCorps2027-windows-x86_64.zip"
          grep ' SpaceCorps2027-windows-x86_64.zip$' SHA256SUMS | sha256sum -c -
          unzip -q SpaceCorps2027-windows-x86_64.zip -d x64
          python --version
          for d in x64 arm64 x86; do ls "/c/Program Files (x86)/Windows Kits/10/Debuggers/$d/cdb.exe" 2>/dev/null; done || true
          systeminfo 2>/dev/null | grep -aE '^(OS Name|OS Version|System Type)' || true
          echo "session: $(powershell -NoProfile -Command '(Get-Process -Id $PID).SessionId')"

      - name: The first crash under a small debugger (module names and offsets only)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/home"
          wh=$(cygpath -m "$RUNNER_TEMP/home")
          cat > "$RUNNER_TEMP/dbg.py" <<'PY'
          """Starts a Windows x64 program under a minimal debugger (kernel32 through ctypes) and prints, for the first
          access violation (or other fatal exception): the code, the address, the module and offset, the bytes at the
          address and the module+offset of the return addresses found on the stack. For the crash investigation of
          docs/design/arm-builds.md; it prints module names and offsets of a public binary, nothing else.

              python dbg.py <exe> [tries] [arguments of the program...]
          """
          import ctypes
          import sys
          from ctypes import wintypes as W

          k32 = ctypes.WinDLL('kernel32', use_last_error=True)
          P = ctypes.c_void_p

          k32.CreateProcessW.argtypes = [W.LPCWSTR, W.LPWSTR, P, P, W.BOOL, W.DWORD, P, W.LPCWSTR, P, P]
          k32.WaitForDebugEvent.argtypes = [P, W.DWORD]
          k32.ContinueDebugEvent.argtypes = [W.DWORD, W.DWORD, W.DWORD]
          k32.OpenThread.argtypes = [W.DWORD, W.BOOL, W.DWORD]
          k32.OpenThread.restype = P
          k32.GetThreadContext.argtypes = [P, P]
          k32.ReadProcessMemory.argtypes = [P, P, P, ctypes.c_size_t, P]
          k32.GetFinalPathNameByHandleW.argtypes = [P, W.LPWSTR, W.DWORD, W.DWORD]
          k32.TerminateProcess.argtypes = [P, W.UINT]
          k32.CloseHandle.argtypes = [P]


          class STARTUPINFOW(ctypes.Structure):
              _fields_ = [('cb', W.DWORD), ('lpReserved', W.LPWSTR), ('lpDesktop', W.LPWSTR), ('lpTitle', W.LPWSTR),
                          ('dwX', W.DWORD), ('dwY', W.DWORD), ('dwXSize', W.DWORD), ('dwYSize', W.DWORD),
                          ('dwXCountChars', W.DWORD), ('dwYCountChars', W.DWORD), ('dwFillAttribute', W.DWORD),
                          ('dwFlags', W.DWORD), ('wShowWindow', W.WORD), ('cbReserved2', W.WORD), ('lpReserved2', P),
                          ('hStdInput', P), ('hStdOutput', P), ('hStdError', P)]


          class PROCESS_INFORMATION(ctypes.Structure):
              _fields_ = [('hProcess', P), ('hThread', P), ('dwProcessId', W.DWORD), ('dwThreadId', W.DWORD)]


          class EXCEPTION_RECORD(ctypes.Structure):
              _fields_ = [('code', W.DWORD), ('flags', W.DWORD), ('record', P), ('address', P), ('nparams', W.DWORD),
                          ('info', ctypes.c_size_t * 15)]


          class EXCEPTION_DEBUG_INFO(ctypes.Structure):
              _fields_ = [('record', EXCEPTION_RECORD), ('first_chance', W.DWORD)]


          class LOAD_DLL_DEBUG_INFO(ctypes.Structure):
              _fields_ = [('hFile', P), ('base', P), ('offset', W.DWORD), ('size', W.DWORD), ('name', P), ('unicode', W.WORD)]


          class CREATE_PROCESS_DEBUG_INFO(ctypes.Structure):
              _fields_ = [('hFile', P), ('hProcess', P), ('hThread', P), ('base', P)]


          class EXIT_PROCESS_DEBUG_INFO(ctypes.Structure):
              _fields_ = [('code', W.DWORD)]


          class UNION(ctypes.Union):
              _fields_ = [('exception', EXCEPTION_DEBUG_INFO), ('load', LOAD_DLL_DEBUG_INFO),
                          ('process', CREATE_PROCESS_DEBUG_INFO), ('exit', EXIT_PROCESS_DEBUG_INFO),
                          ('pad', ctypes.c_ubyte * 160)]


          class DEBUG_EVENT(ctypes.Structure):
              _fields_ = [('code', W.DWORD), ('pid', W.DWORD), ('tid', W.DWORD), ('u', UNION)]


          EXCEPTION, CREATE_PROCESS, EXIT_PROCESS, LOAD_DLL = 1, 3, 5, 6
          DBG_CONTINUE, NOT_HANDLED = 0x00010002, 0x80010001
          # Exceptions programs raise and handle as a matter of course: breakpoints, thread names, C++ and Rust unwinding
          BENIGN = {0x80000003, 0x4001000A, 0x406D1388, 0xE06D7363, 0x40010006, 0x4001000B, 0x80000004, 0xC0000194, 0x4000001F, 0x4000001E}

          modules = []  # (base, name)


          def say(*a):
              print('DBG:', *a, flush=True)


          def module_of(addr):
              best = None
              for base, name in modules:
                  if base <= addr and (best is None or base > best[0]):
                      best = (base, name)
              return best


          def where(addr):
              m = module_of(addr)
              return f'{m[1]}+{addr - m[0]:#x}' if m and addr - m[0] < 0x4000000 else f'{addr:#x}'


          def read(hproc, addr, n):
              buf = ctypes.create_string_buffer(n)
              got = ctypes.c_size_t(0)
              if not k32.ReadProcessMemory(hproc, addr, buf, n, ctypes.byref(got)):
                  return buf.raw[:got.value]
              return buf.raw[:got.value]


          def report(ev, hproc, ex):
              rec = ex.record
              addr = rec.address or 0
              say(f'exception {rec.code:#010x} flags {rec.flags:#x} {"first" if ex.first_chance else "second"} chance at {where(addr)}'
                  f' thread {ev.tid}; access info {rec.info[0]:#x} {rec.info[1]:#x}')
              say('bytes at the address:', read(hproc, addr, 16).hex(' '))
              hthread = k32.OpenThread(0x1A, False, ev.tid)  # GET_CONTEXT | SET_CONTEXT | SUSPEND_RESUME... enough to read
              raw = ctypes.create_string_buffer(1232 + 16)
              off = (-ctypes.addressof(raw)) % 16
              ctx = (ctypes.c_ubyte * 1232).from_buffer(raw, off)
              ctypes.c_uint32.from_buffer(raw, off + 0x30).value = 0x10001F  # CONTEXT_FULL (AMD64)
              if hthread and k32.GetThreadContext(hthread, ctypes.addressof(ctx)):
                  q = lambda o: int.from_bytes(bytes(ctx[o:o + 8]), 'little')
                  rsp, rip = q(0x98), q(0xF8)
                  say(f'rip {where(rip)} rsp {rsp:#x} rax {q(0x78):#x} rcx {q(0x80):#x} rdx {q(0x88):#x} rbx {q(0x90):#x} rsi {q(0xA8):#x} rdi {q(0xB0):#x}')
                  stack = read(hproc, rsp, 8 * 400)
                  seen = []
                  for i in range(0, len(stack) - 7, 8):
                      v = int.from_bytes(stack[i:i + 8], 'little')
                      m = module_of(v)
                      if m and 0 <= v - m[0] < 0x4000000 and m[1].lower().endswith(('.dll', '.exe')):
                          seen.append(f'+{i:#x}:{where(v)}')
                          if len(seen) >= 24:
                              break
                  say('stack words that point into modules:', ' '.join(seen))
              else:
                  say('no thread context')


          def run_once(exe, args=''):
              modules.clear()
              si = STARTUPINFOW()
              si.cb = ctypes.sizeof(si)
              pi = PROCESS_INFORMATION()
              cmd = ctypes.create_unicode_buffer(f'"{exe}" {args}', 32768)
              if not k32.CreateProcessW(exe, cmd, None, None, True, 0x1, None, None, ctypes.byref(si), ctypes.byref(pi)):  # DEBUG_PROCESS
                  say('CreateProcess failed', ctypes.get_last_error())
                  return None
              hproc = pi.hProcess
              ev = DEBUG_EVENT()
              reported = False
              result = None
              while k32.WaitForDebugEvent(ctypes.byref(ev), 120000):
                  status = DBG_CONTINUE
                  if ev.code in (CREATE_PROCESS, LOAD_DLL):
                      info = ev.u.process if ev.code == CREATE_PROCESS else ev.u.load
                      buf = ctypes.create_unicode_buffer(1024)
                      name = ''
                      if info.hFile and k32.GetFinalPathNameByHandleW(info.hFile, buf, 1024, 0):
                          name = buf.value.replace('\\', '/').rsplit('/', 1)[-1]
                      modules.append((info.base or 0, name or '?'))
                      if info.hFile:
                          k32.CloseHandle(info.hFile)
                  elif ev.code == EXCEPTION:
                      ex = ev.u.exception
                      code = ex.record.code
                      status = NOT_HANDLED
                      if code not in BENIGN and not reported and (code & 0xF0000000) in (0xC0000000, 0x80000000):
                          reported = True
                          report(ev, hproc, ex)
                          result = code
                      if not ex.first_chance and code not in BENIGN:
                          k32.ContinueDebugEvent(ev.pid, ev.tid, NOT_HANDLED)
                          k32.TerminateProcess(hproc, 1)
                          continue
                  elif ev.code == EXIT_PROCESS:
                      say(f'process exit code {ev.u.exit.code:#x}')
                      k32.ContinueDebugEvent(ev.pid, ev.tid, DBG_CONTINUE)
                      break
                  k32.ContinueDebugEvent(ev.pid, ev.tid, status)
              k32.CloseHandle(hproc)
              return result


          if __name__ == '__main__':
              exe = sys.argv[1]
              tries = int(sys.argv[2]) if len(sys.argv) > 2 else 6
              for i in range(1, tries + 1):
                  say(f'start {i}')
                  if run_once(exe, ' '.join(sys.argv[3:])) is not None:
                      break
          PY
          cd "$RUNNER_TEMP"
          SPACE3D_HEADLESS=1280x720 SPACE3D_AUDIO=off SPACE3D_EXIT_AFTER_SECS=12 SPACECORPS_SCREEN=login             HOME="$wh" USERPROFILE="$wh" APPDATA="$wh/AppData/Roaming" LOCALAPPDATA="$wh/AppData/Local"             python dbg.py "$(cygpath -w "$RUNNER_TEMP/x64/SpaceCorps 2027/spacecorps2027.exe")" 8 > dbg.out 2>&1
          grep -a '^DBG:' dbg.out | cut -c1-1200
          true

      - name: Variants, 8 starts each (exit code and screenshots only)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/home"
          wh=$(cygpath -m "$RUNNER_TEMP/home")
          exe="$RUNNER_TEMP/x64/SpaceCorps 2027/spacecorps2027.exe"
          variant() { # variant <label> <env words...>
            local label=$1 ok=0 i rc n
            shift
            for i in 1 2 3 4 5 6 7 8; do
              rm -rf "$RUNNER_TEMP/shots"; mkdir -p "$RUNNER_TEMP/shots"
              timeout 120 env SPACE3D_AUDIO=off SPACE3D_EXIT_AFTER_SECS=12 SPACECORPS_SHOT_EVERY=5 SPACECORPS_SCREEN=login \
                "SPACECORPS_SHOTS=$(cygpath -m "$RUNNER_TEMP/shots")" "HOME=$wh" "USERPROFILE=$wh" "APPDATA=$wh/AppData/Roaming" "LOCALAPPDATA=$wh/AppData/Local" \
                "$@" "$exe" > "$RUNNER_TEMP/run.log" 2>&1
              rc=$?
              n=$(find "$RUNNER_TEMP/shots" -name 'shot_*.png' | wc -l)
              if [ "$rc" = 0 ] && [ "$n" -gt 0 ]; then ok=$((ok + 1)); fi
              [ "$i" != 1 ] || echo "  [$label] first start: exit $rc, $n screenshots, $(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/run.log" | grep -aE '^20[0-9-]+T' | tail -1 | cut -c28-110)"
            done
            echo "TALLY $label: $ok of 8 started, ran and wrote screenshots"
          }
          rm -f /c/dumps/*.dmp
          variant "headless (as in the other jobs)" SPACE3D_HEADLESS=1280x720
          variant "a window, not headless" SPACE3D_UNUSED=1
          variant "headless, wgpu power preference low" SPACE3D_HEADLESS=1280x720 WGPU_POWER_PREF=low
          variant "headless, DX12 shader compiler fxc" SPACE3D_HEADLESS=1280x720 WGPU_DX12_SHADER_COMPILER=fxc
          variant "headless, one render thread (RAYON_NUM_THREADS=1)" SPACE3D_HEADLESS=1280x720 RAYON_NUM_THREADS=1
          variant "headless, Vulkan only" SPACE3D_HEADLESS=1280x720 WGPU_BACKEND=vulkan
          variant "headless, OpenGL only" SPACE3D_HEADLESS=1280x720 WGPU_BACKEND=gl
          true
