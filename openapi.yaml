                      type: integer
                      minimum: 8
                      default: 256
                      description: Samples per distribution
      responses:
        '200':
          description: Spectra
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentDensity:
                    type: number
                    description: A/nm^2
                  nottinghamHeat:
                    type: number
                    description: W/nm^2
                  totalEnergyDistribution:
                    $ref: '#/components/schemas/Distribution'
                  normalEnergyDistribution:
                    $ref: '#/components/schemas/Distribution'
                  parallelEnergyDistribution:
                    $ref: '#/components/schemas/Distribution'
                  sumRules:
                    type: array
                    items:
                      type: number
                    description: >-
                      Integral of each distribution divided by J (total, normal,
                      parallel)
