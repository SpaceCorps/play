  /v1/barrier:
    post:
      summary: Barrier potential profile and top
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - field
              properties:
                field:
                  type: number
                  description: V/nm
                radius:
                  type:
                    - number
                    - 'null'
                  description: nm; null = planar
                gamma:
                  type: number
                  default: 10
                distance:
                  type: array
                  items:
                    type: number
                  description: nm
                points:
                  type: integer
                  description: Log-spaced samples from 0.05 nm to maxDistance
                maxDistance:
                  type: number
                  description: nm
      responses:
        '200':
          description: Barrier
          content:
            application/json:
              schema:
                type: object
                properties:
                  distance:
                    type: array
                    items:
                      type: number
                  potential:
                    type: array
