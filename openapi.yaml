components:
  schemas:
    Range:
      type: array
      items:
        type: number
      minItems: 2
      maxItems: 2
      description: '[lower, upper]'
    NumOrArray:
      oneOf:
        - type: number
        - type: array
          items:
            type: number
    Options:
      type: object
      properties:
        mode:
          type: string
          enum:
            - exact
            - wkb
          default: exact
        tolerance:
          type: number
          default: 0.000001
    Point:
      type: object
      required:
        - field
        - workFunction
      properties:
        field:
          type: number
          description: Local field (V/nm)
        radius:
          type:
            - number
            - 'null'
          description: Radius of curvature (nm); null = planar
        gamma:
          type: number
          default: 10
        workFunction:
          type: number
          description: eV
        temperature:
          type: number
          default: 300
          description: K
        effectiveMass:
          type: number
          default: 1
          description: m_e
        bandDepth:
          type: number
          default: 10
          description: eV
        options:
          $ref: '#/components/schemas/Options'
    EmissionRequest:
      type: object
      required:
        - field
        - workFunction
      properties:
        field:
          $ref: '#/components/schemas/NumOrArray'
        radius:
          oneOf:
            - type: number
            - type: 'null'
            - type: array
              items:
                type: number
          description: nm; omit or null for planar
        gamma:
          $ref: '#/components/schemas/NumOrArray'
        workFunction:
          $ref: '#/components/schemas/NumOrArray'
        temperature:
          $ref: '#/components/schemas/NumOrArray'
        effectiveMass:
          $ref: '#/components/schemas/NumOrArray'
        bandDepth:
          $ref: '#/components/schemas/NumOrArray'
        options:
          $ref: '#/components/schemas/Options'
    EmissionResponse:
      type: object
      properties:
        count:
          type: integer
        currentDensity:
          type: array
          items:
            type:
              - number
              - 'null'
          description: A/nm^2
        nottinghamHeat:
          type: array
          items:
            type:
              - number
              - 'null'
          description: W/nm^2; negative = emitter heated
        meanEnergy:
          type: array
          items:
            type:
              - number
              - 'null'
          description: eV relative to E_F
        barrierTop:
          type: array
          items:
            type:
              - number
              - 'null'
          description: eV relative to E_F
        regime:
          type: array
          items:
            type:
              - string
              - 'null'
            enum:
              - field
              - intermediate
              - thermionic
              - null
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PointError'
        elapsedMs:
          type: number
    PointError:
      type: object
      properties:
        index:
          type: integer
        code:
          type: string
        message:
          type: string
    Distribution:
      type: object
      properties:
        energy:
          type: array
          items:
            type: number
          description: eV (relative to E_F; parallel energy >= 0)
        value:
          type: array
          items:
            type: number
          description: A/nm^2/eV
    Estimate:
      type: object
      properties:
        value:
          type: number
        sigma:
          type: number
          description: One standard deviation; 0 if held fixed
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_parameter
        message:
          type: string
          example: Parameter validation failed.
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: invalid_parameter
            message:
              type: string
              example: Parameter validation failed.
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Invalid parameter value provided.
        code:
          type: string
          example: invalid_parameter
    PaginationMeta:
      type: object
      properties:
        cursor:
          type: string
          nullable: true
          description: Pointer to next page cursor.
        has_more:
          type: boolean
          description: True if more records exist beyond this page.
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the next page.
        total_count:
          type: integer
          description: Total number of items in the dataset.
      required:
        - has_more
    JobStatus:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
          description: Unique asynchronous job identifier.
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
          description: Current execution lifecycle state.
        poll_url:
          type: string
          format: uri
          description: Endpoint URL to poll for job progress.
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Fractional completion from 0.0 to 1.0.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          type: object
          nullable: true
          description: Output payload upon completion.
        error:
          $ref: '#/components/schemas/Error'
          nullable: true
      required:
        - job_id
        - status
        - poll_url
    BatchOperation:
      type: object
      properties:
        id:
          type: string
          description: Client-assigned correlation ID.
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - DELETE
          description: HTTP method.
        path:
          type: string
          description: Relative endpoint path.
        body:
          type: object
          nullable: true
          description: Optional operation body.
      required:
        - id
        - method
        - path
    BatchRequest:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/BatchOperation'
          description: List of operations to execute atomically or in sequence.
      required:
        - operations
    BatchOperationResult:
      type: object
      properties:
        id:
          type: string
        status:
          type: integer
          example: 200
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: object
      required:
        - id
        - status
        - body
    BatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchOperationResult'
      required:
        - results
  responses:
    BadRequest:
      description: Bad Request / Parameter Validation Failure (400)
      headers:
        RateLimit-Limit:
          description: The request quota in the current time window
          schema:
            type: integer
        RateLimit-Remaining:
          description: Remaining requests in the current window
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the rate limit resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource Not Found (404)
      headers:
        RateLimit-Limit:
          description: The request quota in the current time window
          schema:
            type: integer
        RateLimit-Remaining:
          description: Remaining requests in the current window
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the rate limit resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded (429)
      headers:
        Retry-After:
          description: Seconds until rate limit quota resets
          schema:
            type: integer
        RateLimit-Limit:
          description: The request quota in the current time window
          schema:
            type: integer
        RateLimit-Remaining:
          description: Remaining requests in the current window
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the rate limit resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Internal Server Error (500)
      headers:
        RateLimit-Limit:
          description: The request quota in the current time window
          schema:
            type: integer
        RateLimit-Remaining:
          description: Remaining requests in the current window
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the rate limit resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Error:
      description: Standard error response
      headers:
        Retry-After:
          description: Seconds until rate limit quota resets
          schema:
            type: integer
        RateLimit-Limit:
          description: The request quota in the current time window
          schema:
            type: integer
        RateLimit-Remaining:
          description: Remaining requests in the current window
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the rate limit resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Unique UUID string to ensure idempotent retries on state-mutating
        operations.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor for fetching the next page of results.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in a single page (1 to 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

