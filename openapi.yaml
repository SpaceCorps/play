  /v1/transmission:
    post:
      summary: Transmission probability vs normal energy for one point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Point'
                - type: object
                  properties:
                    energy:
                      oneOf:
                        - type: number
                        - type: array
                          items:
                            type: number
                      description: Normal energy relative to E_F (eV)
                    points:
                      type: integer
                      default: 101
                      description: >-
                        Evenly spaced energies from max(E_F - 3 eV, band bottom)
                        to barrier top + 1 eV
                    parallelEnergy:
                      type: number
                      default: 0
                      description: eV
      responses:
        '200':
          description: Transmission
          content:
            application/json:
              schema:
                type: object
                properties:
                  energy:
                    type: array
                    items:
                      type: number
                  transmission:
                    type: array
                    items:
                      type: number
                  logTransmission:
                    type: array
                    items:
                      type: number
                  gamow:
                    type: array
